[package]
name = "companion"
version = "0.3.1"
edition = "2024"
publish = false
description = "flankr's companion app: a libmorph window on the desktop and on Android, on flankr-companion and flankr-audio"

# Started as a copy of libvoicexn's examples/voicexn at v0.2.0
# (32b8032082997a34190b458f79716d998a0d850a); plan 20261022_04, decision 8.

[lib]
name = "companion"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "companion"
path = "src/main.rs"

[dependencies]
flankr-companion = { path = "../../crates/flankr-companion" }
# The terminal mode's grid: its runs, colours and attribute flags (plan
# 20261027_07, step 5).
libflankr_term = { path = "../../crates/libflankr_term" }
flankr-audio = { path = "../../crates/flankr-audio" }
# `StaticKey`, which the key store's Noise key implements.
libflankr_proto = { path = "../../crates/libflankr_proto", features = ["link"] }
# libmorph 0.5.1 (tag v0.5.1): the key store and the secure store
# (`secure-store`), the camera (`ctx.camera()`, `on_camera`; plan
# 20261028_02), URL schemes (`on_open_url`), `open_link`, `data_dir` on every host,
# `build_info`, and the memory hooks (`on_low_memory`, `on_trim_memory`);
# 0.5.1: `clipboard_text` and `clipboard_has_text`, for Paste text (plan
# 20261028_06, decision 11.4; macOS through libdevice, Android through
# `mobile-clipboard` below).
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "c958897495d880c6117cae55e1b4d72b0c1b15a0", default-features = false, features = ["secure-store"] }
# The revision libcontrols pins, so the graph holds one libmsdf (as voicexn).
# 0.6.0 (with libcontrols 0.7.0): the terminal face and symbol page for the
# agent view (plan 20261022_03, decision 9), with cell boxes and Claude
# Code's interface glyphs; 0.6.1 with libcontrols 0.10.8; 0.6.2 (the coding-agent
# glyphs: ⊙ ⦿ ⋮ and the rest, libmsdf plan 20261028_01) with libcontrols 0.10.9.
libmsdf = { git = "https://github.com/tmzt/libmsdf", rev = "bd7383dcb936c987dfd7f777e9b3baecbe3317e7", features = ["font-apache-roboto-regular", "font-apache-roboto-bold", "font-apache-roboto-italic", "fonts-ofl-terminal"] }
# Basic Markdown, laid out as wrapped styled runs, for the settings copy
# (docs/design/20261024_04_MARKDOWN_RENDERER_PLAN.md, step 2), drawn in
# Roboto Regular, Bold and Italic (above) and the terminal face.
flankr-markdown = { path = "../../crates/flankr-markdown" }
# 0.10.3 (tag v0.10.3): PopupMenu, for the title bars' ⋮ (plan
# 20261028_04, step 7); with Drawer and DrawerLayout (0.10.1) and
# EditableLabel (0.10.2) for the session drawer (plan 20261028_03, step 5);
# 0.10.0's label change needs nothing here (every Button label is plain).
# TextArea since 0.9.1. 0.10.8 (tag v0.10.8): toggle items that keep the
# PopupMenu open (0.10.6, `PopupItem::toggle`, `PopupMenuEvent::Toggled`),
# for the volume menu (plan 20261028_06, decision 3). On the same libmsdf.
libcontrols = { git = "https://github.com/tmzt/libcontrols", rev = "9acdd6cdc31f99397f597c24bd5ff1fa341258b5" }
# The preview (plan 20261028_05, step 8): libflankr_blob's `ReadPattern`
# for the transcript's path links, and PNG decoding on the desktop (the
# 21:29 EDT amendment, item 6), at the version flankr-companion uses.
libflankr_blob = { path = "../../crates/libflankr_blob" }
png = "0.18"
# The device halves' supported daemon versions, in Cargo's caret meaning
# (plan 20261028_04, 3.4 item 3); the version already in Cargo.lock.
semver = "1.0.28"
log = "0.4"
# The key store's Noise key (src/keys.rs): cleared on drop, X25519 with the
# curve25519-dalek snow already uses, and a random key from the OS.
zeroize = { version = "1.8", features = ["derive"] }
curve25519-dalek = "4.1.3"
getrandom = "0.2"
# The server record, a TOML blob in the secure store, in FileKeyStore's layout.
serde = { version = "1", features = ["derive"] }
# The plugins' params and results (plan 20261028_04, step 6).
serde_json = "1"
# themes.toml (src/theme.rs), its themes in file order.
toml = { version = "0.8", features = ["preserve_order"] }
base64 = "0.22"
# The time a message was sent, in the phone's time zone (localtime_r):
# std has none (plan 20261027_03, decision 3).
libc = "0.2"

# The desktop window: the default devices through cpal, logs to stderr.
[target.'cfg(not(target_os = "android"))'.dependencies]
flankr-audio = { path = "../../crates/flankr-audio", features = ["cpal"] }
env_logger = "0.11"

# Android: libmorph's audio and libmobile, and libmorph's Sink and Source;
# the foreground service and its events (`on_service`), system events, and
# the battery pages (libmorph 0.4.0, plan 20261024_02's Background and
# Battery sections); the QR scan and its viewfinder (`mobile-camera-qr`,
# plan 20261028_02, decision 19), which adds CAMERA and the optional camera
# `uses-feature` to the manifest.
[target.'cfg(target_os = "android")'.dependencies]
flankr-audio = { path = "../../crates/flankr-audio", features = ["morph"] }
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "c958897495d880c6117cae55e1b4d72b0c1b15a0", default-features = false, features = ["audio", "mobile", "secure-store", "mobile-foreground-service", "mobile-system-events", "mobile-battery", "mobile-camera-qr", "mobile-clipboard"] }
android_logger = "0.14"

# Generates the Gradle project when building for Android; a no-op on the
# host. libmorph-build 0.3.0 (tag libmorph-build-v0.3.0): libmobile 0.3.1,
# whose manifest metadata carries the camera's.
[build-dependencies]
libmorph-build = { git = "https://github.com/tmzt/libmorph", rev = "b8eb1010d5886dba636603e189a00262de60447f" }
# copy/*.md, read into copy.rs (plan 20261024_04, decision
# 6), at the revision the root crate pins for ADDITIONAL_PROMPTS.md.
libtypedmd = { git = "https://github.com/tmzt/libtypedmd", rev = "a61c091e6420a1dfc40e89b8600cd26e628e5f7a" }
# themes.toml, checked with build/themes_check.rs (plan 20261024_05), as
# the app parses it.
toml = { version = "0.8", features = ["preserve_order"] }

# The key tests use libdevice's memory vault, through libmorph's `script`.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "c958897495d880c6117cae55e1b4d72b0c1b15a0", default-features = false, features = ["secure-store", "script"] }

# The settings tests write settings.toml and delete data in a scratch directory.
[dev-dependencies]
tempfile = "3"
# The scripted pairing scan's test daemon in pair mode (plan 20261028_02,
# section 5, run 2), as flankr-companion's tests/link.rs builds one.
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
serde_json = "1"
# The copy generator's own tests (build/copy_gen.rs, also compiled into the
# library's tests).
libtypedmd = { git = "https://github.com/tmzt/libtypedmd", rev = "a61c091e6420a1dfc40e89b8600cd26e628e5f7a" }
