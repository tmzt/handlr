[package]
name = "companion"
version = "0.1.0"
edition = "2024"
publish = false
description = "flankr's companion app: a libmorph window on the desktop and on Android, on flankr-companion and flankr-audio"

# Started as a copy of libvoicexn's examples/voicexn at v0.2.0
# (32b8032082997a34190b458f79716d998a0d850a); plan 20261022_04, decision 8.

[lib]
name = "companion"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "companion"
path = "src/main.rs"

[dependencies]
flankr-companion = { path = "../../crates/flankr-companion" }
# The terminal mode's grid: its runs, colours and attribute flags (plan
# 20261027_07, step 5).
libflankr_term = { path = "../../crates/libflankr_term" }
flankr-audio = { path = "../../crates/flankr-audio" }
# `StaticKey`, which the key store's Noise key implements.
libflankr_proto = { path = "../../crates/libflankr_proto", features = ["link"] }
# libmorph 0.4.1: the key store and the secure store (`secure-store`), URL
# schemes (`on_open_url`), `open_link`, `data_dir` on every host,
# `build_info`, and the memory hooks (`on_low_memory`, `on_trim_memory`).
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "0b288e8d1096c0b7441bc953ce745a44a9632be8", default-features = false, features = ["secure-store"] }
# The revision libcontrols pins, so the graph holds one libmsdf (as voicexn).
# 0.6.0 (with libcontrols 0.7.0): the terminal face and symbol page for the
# agent view (plan 20261022_03, decision 9), with cell boxes and Claude
# Code's interface glyphs.
libmsdf = { git = "https://github.com/tmzt/libmsdf", rev = "4de319ce57aea99297de0a805b899276dd90b411", features = ["font-apache-roboto-regular", "font-apache-roboto-bold", "font-apache-roboto-italic", "fonts-ofl-terminal"] }
# Basic Markdown, laid out as wrapped styled runs, for the settings copy
# (docs/design/20261024_04_MARKDOWN_RENDERER_PLAN.md, step 2), drawn in
# Roboto Regular, Bold and Italic (above) and the terminal face.
flankr-markdown = { path = "../../crates/flankr-markdown" }
# 0.9.1: TextArea multi-line text edit with cursor (plan 20261025_02), on the same libmsdf.
libcontrols = { git = "https://github.com/tmzt/libcontrols", rev = "52e6c074637c9bb38b28d807535463c6d0ef4cc4" }
log = "0.4"
# The key store's Noise key (src/keys.rs): cleared on drop, X25519 with the
# curve25519-dalek snow already uses, and a random key from the OS.
zeroize = { version = "1.8", features = ["derive"] }
curve25519-dalek = "4.1.3"
getrandom = "0.2"
# The server record, a TOML blob in the secure store, in FileKeyStore's layout.
serde = { version = "1", features = ["derive"] }
# themes.toml (src/theme.rs), its themes in file order.
toml = { version = "0.8", features = ["preserve_order"] }
base64 = "0.22"
# The time a message was sent, in the phone's time zone (localtime_r):
# std has none (plan 20261027_03, decision 3).
libc = "0.2"

# The desktop window: the default devices through cpal, logs to stderr.
[target.'cfg(not(target_os = "android"))'.dependencies]
flankr-audio = { path = "../../crates/flankr-audio", features = ["cpal"] }
env_logger = "0.11"

# Android: libmorph's audio and libmobile, and libmorph's Sink and Source;
# the foreground service and its events (`on_service`), system events, and
# the battery pages (libmorph 0.4.0, plan 20261024_02's Background and
# Battery sections).
[target.'cfg(target_os = "android")'.dependencies]
flankr-audio = { path = "../../crates/flankr-audio", features = ["morph"] }
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "0b288e8d1096c0b7441bc953ce745a44a9632be8", default-features = false, features = ["audio", "mobile", "secure-store", "mobile-foreground-service", "mobile-system-events", "mobile-battery"] }
android_logger = "0.14"

# Generates the Gradle project when building for Android; a no-op on the host.
[build-dependencies]
libmorph-build = { git = "https://github.com/tmzt/libmorph", rev = "0b288e8d1096c0b7441bc953ce745a44a9632be8" }
# SETTINGS_COPY.md, read into settings_copy.rs (plan 20261024_04, decision
# 6), at the revision the root crate pins for ADDITIONAL_PROMPTS.md.
libtypedmd = { git = "https://github.com/tmzt/libtypedmd", rev = "a61c091e6420a1dfc40e89b8600cd26e628e5f7a" }
# themes.toml, checked with build/themes_check.rs (plan 20261024_05), as
# the app parses it.
toml = { version = "0.8", features = ["preserve_order"] }

# The key tests use libdevice's memory vault, through libmorph's `script`.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "0b288e8d1096c0b7441bc953ce745a44a9632be8", default-features = false, features = ["secure-store", "script"] }

# The settings tests write settings.toml and delete data in a scratch directory.
[dev-dependencies]
tempfile = "3"
# The copy generator's own tests (build/copy_gen.rs, also compiled into the
# library's tests).
libtypedmd = { git = "https://github.com/tmzt/libtypedmd", rev = "a61c091e6420a1dfc40e89b8600cd26e628e5f7a" }
