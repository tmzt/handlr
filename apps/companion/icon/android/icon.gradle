// The launcher icon, applied to the generated app module through
// `Project::extra_script` in build.rs. Goes away once libmobile/libmorph
// support icons (`Project::icon`, requested of them on 2026-10-24).
//
// res/ is generated by ../make_icon.py. The manifest overlay sets
// android:icon and android:roundIcon, which the generated manifest leaves
// out; build-type manifests merge over main, so it is given to both.

def iconDir = buildscript.sourceFile.parentFile

android {
    sourceSets {
        main {
            res.srcDir new File(iconDir, 'res')
        }
        debug {
            manifest.srcFile new File(iconDir, 'AndroidManifest.xml')
        }
        release {
            manifest.srcFile new File(iconDir, 'AndroidManifest.xml')
        }
    }
}
