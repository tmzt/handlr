# The companion app's themes (docs/design/20261024_05_THEMES_PLAN.md).
#
# Checked by build.rs (build/themes_check.rs), compiled in, and parsed at
# start; a themes.toml in the app's data directory, beside settings.toml,
# adds themes (a new id) or replaces them (a shipped id).
#
# Each [theme.<id>] has a `name`, `dark` (true or false), and colour roles,
# each "#RRGGBB", "#RRGGBBAA", or [r, g, b, a] from 0 to 1. The first dark
# theme and the first light theme are the defaults and set every role; any
# other theme may leave roles out, and each one left out is its kind's
# default's. The roles:
#
#   surfaces  bg header card band input overlay
#   text      text fg dim muted code link spoken
#   states    accent question green red yellow warn recording
#   buttons   approve deny message back button toggle
#   chrome    scrollbar placeholder shimmer shadow
#
# Buttons are drawn with `fg` labels, so on a light theme they are light.

# The colours the app had before themes, exactly (as numbers, since most
# are not n/255).
[theme.dark_gray]
name = "Dark (gray)"
dark = true
bg = [0.03, 0.03, 0.04, 1.0]
header = [0.07, 0.07, 0.09, 1.0]
card = [0.11, 0.12, 0.17, 1.0]
band = [0.18, 0.19, 0.21, 1.0]
input = [0.09, 0.10, 0.13, 1.0]
overlay = [0.0, 0.0, 0.0, 0.55]
text = [0.92, 0.93, 0.95, 1.0]
fg = [0.94, 0.95, 0.96, 1.0]
dim = [0.50, 0.53, 0.58, 1.0]
muted = [0.60, 0.62, 0.68, 1.0]
code = [1.0, 0.86, 0.45, 1.0]
link = [0.45, 0.78, 1.0, 1.0]
spoken = [0.55, 0.78, 1.0, 1.0]
accent = [1.0, 0.74, 0.25, 1.0]
question = [0.42, 0.72, 1.0, 1.0]
green = [0.36, 0.93, 0.45, 1.0]
red = [1.0, 0.40, 0.40, 1.0]
yellow = [1.0, 0.82, 0.30, 1.0]
warn = [1.0, 0.62, 0.45, 1.0]
recording = [1.0, 0.35, 0.35, 1.0]
approve = [0.16, 0.45, 0.25, 1.0]
deny = [0.55, 0.18, 0.18, 1.0]
message = [0.20, 0.32, 0.55, 1.0]
back = [0.30, 0.30, 0.36, 1.0]
button = [0.24, 0.25, 0.31, 1.0]
toggle = [0.22, 0.62, 0.36, 1.0]
# libcontrols' scroll indicator, as the settings drew it.
scrollbar = [0.55, 0.62, 0.70, 0.5]
placeholder = [0.94, 0.95, 0.96, 0.06]
shimmer = [0.94, 0.95, 0.96, 0.013333333]
shadow = [0.0, 0.0, 0.0, 0.55]

