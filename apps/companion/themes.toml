session_12 = "#3A6FD0"  # blue, dark
session_13 = "#C3A2FF"  # violet, light
session_14 = "#7A52C8"  # violet, dark
session_15 = "#FF9AD5"  # pink, light
session_16 = "#B8448A"  # pink, dark

