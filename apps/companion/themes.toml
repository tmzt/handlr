card = "#3C3836"        # bg1
band = "#504945"        # bg2
input = "#32302F"       # bg0_s
text = "#EBDBB2"        # fg1
fg = "#FBF1C7"          # fg0
dim = "#928374"         # gray, comments
muted = "#A89984"       # fg4
code = "#FE8019"        # orange
link = "#83A598"        # blue
spoken = "#8EC07C"      # aqua
accent = "#FABD2F"      # yellow
question = "#83A598"    # blue
green = "#B8BB26"
red = "#FB4934"
yellow = "#FABD2F"
warn = "#FE8019"        # orange
recording = "#FB4934"
approve = "#79740E"     # faded green
deny = "#9D0006"        # faded red
message = "#076678"     # faded blue
