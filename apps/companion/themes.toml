code = "#F1FA8C"        # yellow
link = "#8BE9FD"        # cyan
spoken = "#FF79C6"      # pink
accent = "#FFB86C"      # orange
question = "#BD93F9"    # purple
green = "#50FA7B"
red = "#FF5555"
yellow = "#F1FA8C"
warn = "#FFB86C"        # orange
recording = "#FF5555"
approve = "#2A7A45"     # green, deep
deny = "#8B2E3B"        # red, deep
message = "#6247AA"     # purple, deep
back = "#44475A"
button = "#3A3C4E"
toggle = "#50FA7B"
scrollbar = "#6272A480"
placeholder = "#F8F8F20F"
shimmer = "#F8F8F203"

