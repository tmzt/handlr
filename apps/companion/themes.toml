# Nord, by Arctic Ice Studio (https://www.nordtheme.com/): Polar Night
# nord0 #2e3440 … nord3 #4c566a, Snow Storm nord4 #d8dee9 … nord6
# #eceff4, Frost nord7 #8fbcbb … nord10 #5e81ac, Aurora nord11 #bf616a,
# nord12 #d08770, nord13 #ebcb8b, nord14 #a3be8c, nord15 #b48ead. The
# comments are nord3's brighter #616e88, as Nord's editor themes use.
[theme.nord]
name = "Nord"
dark = true
bg = "#2E3440"          # nord0
header = "#272C36"      # nord0, darker
card = "#3B4252"        # nord1
band = "#434C5E"        # nord2
input = "#353B49"
text = "#D8DEE9"        # nord4
fg = "#ECEFF4"          # nord6
dim = "#616E88"         # comments
muted = "#8C96AA"
code = "#EBCB8B"        # nord13
link = "#88C0D0"        # nord8
spoken = "#8FBCBB"      # nord7
accent = "#D08770"      # nord12
question = "#81A1C1"    # nord9
green = "#A3BE8C"       # nord14
red = "#BF616A"         # nord11
yellow = "#EBCB8B"      # nord13
warn = "#D08770"        # nord12
recording = "#BF616A"
approve = "#56704A"     # nord14, deep
deny = "#7E3D44"        # nord11, deep
message = "#5E81AC"     # nord10
back = "#4C566A"        # nord3
button = "#434C5E"      # nord2
toggle = "#A3BE8C"
scrollbar = "#D8DEE960"
placeholder = "#ECEFF40F"
shimmer = "#ECEFF403"

