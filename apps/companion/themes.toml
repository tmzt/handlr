# Solarized, by Ethan Schoonover (https://ethanschoonover.com/solarized/):
# base03 #002b36, base02 #073642, base01 #586e75, base00 #657b83,
# base0 #839496, base1 #93a1a1, base2 #eee8d5, base3 #fdf6e3; yellow
# #b58900, orange #cb4b16, red #dc322f, magenta #d33682, violet #6c71c4,
# blue #268bd2, cyan #2aa198, green #859900. Surfaces between the bases
# and the buttons' shades are blends of these.
[theme.solarized_dark]
name = "Solarized Dark"
dark = true
bg = "#002B36"          # base03
header = "#00232C"      # base03, darker
card = "#073642"        # base02
band = "#0D4553"        # base02, lighter
input = "#03303C"
text = "#839496"        # base0, body text
fg = "#93A1A1"          # base1, emphasized
dim = "#586E75"         # base01, comments
muted = "#657B83"       # base00
code = "#B58900"        # yellow
link = "#268BD2"        # blue
spoken = "#2AA198"      # cyan
accent = "#CB4B16"      # orange
question = "#268BD2"    # blue
green = "#859900"
red = "#DC322F"
yellow = "#B58900"
warn = "#CB4B16"        # orange
recording = "#DC322F"
approve = "#3D5200"     # green, deep
deny = "#7A1E1C"        # red, deep
message = "#134F78"     # blue, deep
back = "#1A5060"
button = "#0F4250"
toggle = "#859900"
scrollbar = "#83949680"
placeholder = "#93A1A10F"
shimmer = "#93A1A103"

[theme.solarized_light]
name = "Solarized Light"
dark = false
bg = "#FDF6E3"          # base3
header = "#EEE8D5"      # base2
card = "#EEE8D5"        # base2
band = "#E2DBC5"        # base2, darker
input = "#F6EFDB"
text = "#586E75"        # base01: base00 is too light to read on a card
fg = "#073642"          # base02, emphasized
dim = "#93A1A1"         # base1, comments
muted = "#657B83"       # base00
code = "#CB4B16"        # orange
link = "#268BD2"        # blue
spoken = "#6C71C4"      # violet
accent = "#B58900"      # yellow
question = "#268BD2"    # blue
green = "#859900"
red = "#DC322F"
yellow = "#B58900"
warn = "#CB4B16"        # orange
recording = "#DC322F"
approve = "#DCE3B3"     # green, pale
deny = "#F3CFC6"        # red, pale
message = "#CFE1EF"     # blue, pale
back = "#E4DDC8"
button = "#E8E2CE"
toggle = "#859900"
scrollbar = "#657B8380"
placeholder = "#0736420F"
shimmer = "#07364205"
shadow = "#00000033"

