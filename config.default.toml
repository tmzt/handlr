# Default configuration for handlr
# Copy to ~/.config/handlr/config.toml to customize

# Master switch for arbitrary commands. Uncomment to force the setting on or
# off for every agent below; leave it out to honour each agent's own value.
# The --allow-arbitrary-commands / --no-arbitrary-commands CLI flags override both.
# allow_arbitrary_commands = false

[[transports]]
name = "local"
# Transport mode: "local" (direct Unix domain socket) or "remote" (SSH bridge)
mode = "local"
# Optional socket path for local mode (default: ~/.config/herdr/herdr.sock)
# socket = "~/.config/herdr/herdr.sock"
default = true

[[transports]]
name = "mini"
mode = "remote"
# Remote SSH connection string (e.g. "user@host")
remote = "tmeade@timothys-mac-mini-1"

[[agents]]
name = "claude"
allowed_commands = ["continue", "/compact"]
require_confirmation = true
# Allow free-form spoken instructions that are not on the allow list above.
# These are typed verbatim into the agent's prompt, so they are restricted to
# ASCII letters, digits, spaces and the punctuation . , ' ? : ; no '/' (slash
# commands, paths), no '-' (CLI flags), no control characters, 256 chars max.
allow_arbitrary_commands = false

[[agents]]
name = "omp"
allowed_commands = ["continue"]
require_confirmation = true
allow_arbitrary_commands = false

[[agents]]
name = "agy"
allowed_commands = ["continue"]
require_confirmation = true
allow_arbitrary_commands = false

[gemini]
# Optional Gemini API Key (defaults to GEMINI_API_KEY environment variable)
# api_key = "..."
# model = "gemini-2.5-flash"

# How agents are named aloud and on screen. Uncomment to change the defaults.
# [naming]
# Words of at most this many letters with none of `vowels` are spelled out
# letter by letter ("hr" -> "aitch ar"). 0 turns spelling off.
# spell_max_len = 6
# vowels = "aeiouy"
#
# [naming.letters]
# Any letter's spoken name; unlisted letters keep the default English names.
# w = "dub"
#
# [naming.aliases]
# A tab label as written, a project, or an agent name (any case) -> what to
# say and show instead. Alias values are never spelled out.
# "ctrls" = "controls"
# "17-hr" = "handlr"
# "agy" = "antigravity"

# The encrypted link for paired devices (`handlr pair`). By default it
# listens only on 127.0.0.1:7347; to reach it from the tailnet, run
#   tailscale serve --bg --tcp 7347 tcp://127.0.0.1:7347
# An explicit list replaces the default and the Tailscale check, and is what
# pairing strings carry. `listen = []` turns the link off.
# [link]
# listen = ["127.0.0.1:7347"]
# key = "~/.config/handlr/link_key"      # the server's private key, mode 0600
# auth = "~/.config/handlr/auth.toml"    # the paired clients
# revoke_check_secs = 60                 # how often open connections are checked
