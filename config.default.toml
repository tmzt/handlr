# Default configuration for flankr
# Copy to ~/.config/flankr/config.toml to customize

# Master switch for arbitrary commands. Uncomment to force the setting on or
# off for every agent below; leave it out to honour each agent's own value.
# The --allow-arbitrary-commands / --no-arbitrary-commands CLI flags override both.
# allow_arbitrary_commands = false

[[transports]]
name = "local"
# Transport mode: "local" (direct Unix domain socket) or "remote" (SSH bridge)
mode = "local"
# Optional socket path for local mode (default: ~/.config/herdr/herdr.sock)
# socket = "~/.config/herdr/herdr.sock"
default = true

[[transports]]
name = "mini"
mode = "remote"
# Remote SSH connection string (e.g. "user@host")
remote = "tmeade@timothys-mac-mini-1"

[[agents]]
name = "claude"
allowed_commands = ["continue", "/compact"]
require_confirmation = true
# Allow free-form spoken instructions that are not on the allow list above.
# These are typed verbatim into the agent's prompt, so they are restricted to
# ASCII letters, digits, spaces and the punctuation . , ' ? : ; no '/' (slash
# commands, paths), no '-' (CLI flags), no control characters, 256 chars max.
allow_arbitrary_commands = false
# The key that stops this agent's work when a companion turn is interrupted
# or `agents.interrupt` is called, in herdr's key names. Sent as a keystroke,
# never typed. Default "esc"; "" turns interrupting off.
# interrupt_key = "esc"
# Typing into this agent's pane from the companion's terminal view, once the
# owner arms it there. Needs [terminal] input = true below and a paired
# device that may approve. terminal_signals also lets ctrl+c, ctrl+d, ctrl+z
# and ctrl+\ through. Both default to false.
# terminal_input = false
# terminal_signals = false

[[agents]]
name = "omp"
allowed_commands = ["continue"]
require_confirmation = true
allow_arbitrary_commands = false

[[agents]]
name = "agy"
allowed_commands = ["continue"]
require_confirmation = true
allow_arbitrary_commands = false

# A pane that runs no known agent (a shell, htop, a build): the companion
# lists it and opens it only in its terminal view. Read-only by default:
# nothing is typed into it unless terminal_input = true here (and [terminal]
# input = true below, and the owner arms it on the phone). It takes no
# commands, messages or interrupt key; the global allow_arbitrary_commands
# never turns arbitrary commands on for it. Remove this entry to refuse its
# terminal too.
[[agents]]
name = "shell"
allowed_commands = []
require_confirmation = true
allow_arbitrary_commands = false
allow_messages = false
interrupt_key = ""
terminal_input = false

# Every LLM flankr uses itself: the general agent's turns, card summaries
# and spoken summaries; never the coding agents in the panes. Off unless
# `enabled = true`: without it, nothing calls any model. Turned on, the rest
# is automatic: a `gemini` backend is found from `.private/gemini_api_key`
# (in the daemon's working folder, mode 0600) or GEMINI_API_KEY, every use
# is on, and each use gets its tier model: gemini-3.8-flash for the general
# agent, gemini-3.8-flash-lite for summaries. A Pro model runs only where a
# `model` names it. The daemon reads this section again when the file or a
# key file changes (every 5 s if it can't watch files), and tells the
# companion app what is available.
# [llm]
# enabled = true
# default = "gemini"             # the backend a use takes when it names none
#
# Named backends, when the defaults aren't wanted. `kind` picks the client
# (only "gemini" for now); two backends of one kind may differ in key or
# model. A backend's `model` is its model for every use.
# [llm.backends.gemini]
# kind = "gemini"
# api_key_file = ".private/gemini_api_key"
# model = "gemini-3.8-flash"
#
# Uses, each optional: general_agent, card_summaries, spoken_summaries.
# Each is on unless `enabled = false`; `backend` and `model` override.
# [llm.uses.general_agent]
# backend = "gemini"
# model = "gemini-3.8-flash"
#
# [llm.uses.spoken_summaries]
# enabled = false
#
# Planning: the general agent's own turns, on its backend and model, may
# read the current project's files and its agent instructions. Off unless
# `enabled = true`, and only while general_agent is on. `read` lists the
# files `list_files` and `read_file` may read, as `/`-separated patterns
# against the project's root: `*` is any part of one name, `**` alone is
# any number of folders, so "*.md" is the top folder only. Without `read`
# the file tools are off. `agents_prompt` adds the project's AGENTS.md
# (or CLAUDE.md, or GEMINI.md) to each turn.
# [llm.uses.planning]
# enabled = true
# agents_prompt = true
# read = ["*.md", "docs/**/*.md"]

# Deprecated: [gemini] is read as [llm] enabled = true with
# [llm.backends.gemini] (its `api_key_file` and `model`), until [llm] enabled is
# set; [llm.uses.*] or [llm.backends.*] tables alone do not count.
# [gemini]
# api_key_file = ".private/gemini_api_key"
# model = "gemini-3.8-flash"

# How agents are named aloud and on screen. Uncomment to change the defaults.
# [naming]
# Where an agent's project name comes from: "directory" (its cwd's last
# part, the default) or "workspace" (herdr's workspace label, or the cwd's
# last part when agents share a label).
# project_from = "directory"
#
# Words of at most this many letters with none of `vowels` are spelled out
# letter by letter ("hr" -> "aitch ar"). 0 turns spelling off.
# spell_max_len = 6
# vowels = "aeiouy"
#
# [naming.letters]
# Any letter's spoken name; unlisted letters keep the default English names.
# w = "dub"
#
# [naming.aliases]
# A tab label as written, a project, or an agent name (any case) -> what to
# say and show instead. Alias values are never spelled out.
# "ctrls" = "controls"
# "17-fl" = "flankr"
# "agy" = "antigravity"

# The encrypted link for paired devices (`flankr pair`). By default it
# listens only on 127.0.0.1:7347; to reach it from the tailnet, run
#   tailscale serve --bg --tcp 7347 tcp://127.0.0.1:7347
# An explicit list replaces the default and the Tailscale check, and is what
# pairing strings carry. `listen = []` turns the link off.
# [link]
# listen = ["127.0.0.1:7347"]
# key = "~/.config/flankr/link_key"      # the server's private key, mode 0600
# auth = "~/.config/flankr/auth.toml"    # the paired clients
# revoke_check_secs = 60                 # open connections are checked when
#                                        # auth.toml changes, and this often

# The companion's terminal view of a session, read-only unless `input`.
# `input = true` lets a paired device that may approve type into the panes of
# agents with `terminal_input = true`, after arming it in the app; an arm
# lasts 60 s from the last key. Off unless set. Only for a herdr reached over
# its local socket, not a remote (SSH) one.
#
# `attach = true` (the default, for testing) keeps the daemon attached to the
# local herdr as one of herdr's own clients: an open terminal shows herdr's
# own cells, the cursor and the pane at the phone's size, and takes mouse
# input. While a phone's terminal is open, herdr's tab is sized to the phone
# and herdr's focus moves to the session's pane; a change made on the
# desktop is not forced back until the phone's terminal is touched again.
# With no terminal open the attachment claims nothing. `attach = false`
# reads terminals with herdr's `pane.read` poll only.
# [terminal]
# input = false
# attach = true

# Links from `docs/…` paths in the companion's agent view to their pages on
# repowiki (`~/src/repowiki`). Each agent's site is its directory's parent
# and own name joined with `--` (`~/src/flankr` is `src--flankr`); a path
# links to `<repowiki_url>/#/<site>/<path without .md>`. Without it no
# path is linked (web links always are).
# [urls]
# repowiki_url = "http://localhost:8088"

# Deprecated: [summary] cards = false is read as
# [llm.uses.card_summaries] enabled = false, unless [llm] is set. With card
# summaries on, every new Finished card is summarised once: a few points
# and the text to read aloud go on the card.
# [summary]
# cards = true
