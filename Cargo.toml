[package]
name = "handlr"
version = "0.1.0"
edition = "2021"

[dependencies]
libherdr = { path = "crates/libherdr" }
smol = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
async-compat = "0.2"
schemars = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
libinfer = { path = "crates/libinfer" }
toml = "0.8"
# Confirmation tokens and nonces (src/core/confirm.rs).
blake2 = "0.10"
getrandom = "0.2"
# The daemon (src/server/): socket lines, peer uid, wire types.
libhandlr_proto = { path = "crates/libhandlr_proto", features = ["link"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
libc = "0.2"
# The link (src/server/link/): link_key and auth.toml keys are base64,
# `handlr pair` prints a QR code, link sockets get SO_KEEPALIVE.
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
socket2 = "0.6"

[dev-dependencies]
# Paused time for the confirmation broker's timers.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[workspace]
members = [
    ".",
    "crates/handlr-audio",
    "crates/handlr-companion",
    "crates/libhandlr_proto",
    "crates/libherdr",
    "crates/libinfer"
]
# handlr-audio is built with -p only: it compiles libvoicexn's ML stack
# (docs/design/20261022_04_COMPANION_APP_PLAN.md, 18:10 EDT amendment).
default-members = [
    ".",
    "crates/handlr-companion",
    "crates/libhandlr_proto",
    "crates/libherdr",
    "crates/libinfer"
]
