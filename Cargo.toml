[package]
name = "flankr"
version = "0.3.1"
edition = "2024"

[dependencies]
libherdr = { path = "crates/libherdr" }
smol = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
async-compat = "0.2"
schemars = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
libinfer = { path = "../libinfer/libinfer" }
libinfer-gemini = { path = "../libinfer/libinfer-gemini" }
toml = "0.8"
# Confirmation tokens and nonces (src/core/confirm.rs).
blake2 = "0.10"
getrandom = "0.2"
# The daemon (src/server/): socket lines, peer uid, wire types.
libflankr_proto = { path = "crates/libflankr_proto", features = ["link"] }
# The terminal mode's frames and mirror (src/server/terminal.rs, plan 20261027_07).
libflankr_term = { path = "crates/libflankr_term" }
# The terminal read from herdr's attachment (src/server/herdr_attach.rs,
# plan 20261027_08, steps 7 and 8).
libherdr_term = { path = "crates/libherdr_term" }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
libc = "0.2"
# The link (src/server/link/): link_key and auth.toml keys are base64,
# link sockets get SO_KEEPALIVE.
base64 = "0.22"
socket2 = "0.6"
# `flankr pair`: the pairing URL's QR code as a PNG (plan 20261022_06).
qrcodeurl = { path = "crates/qrcodeurl" }
# The reading rules and the complexity measure (plan 20261023_05, A5).
flankr-speech = { path = "crates/flankr-speech" }
# ADDITIONAL_PROMPTS.md (src/prompts.rs, plan 20261023_05), v0.2.0.
libtypedmd = { git = "https://github.com/tmzt/libtypedmd", rev = "a61c091e6420a1dfc40e89b8600cd26e628e5f7a" }
# agy session reader (src/sessions/agy.rs, plan 20261023_06).
rusqlite = { version = "0.32", features = ["bundled"] }
# The current project's files for list_files (src/project.rs, plan 20261027_04),
# already in Cargo.lock.
walkdir = "2"
# The daemon's file watcher (src/watch_files.rs, plan 20261027_05, step 1).
notify = "8.2"
notify-debouncer-mini = "0.7"
# The instructions marker's hash (src/transport.rs, plan 20261027_05, step 4),
# already in Cargo.lock.
sha2 = "0.10"
# Writing `[plugins."<ns>"] enabled` with the rest of config.toml kept as
# written (src/plugins/host.rs, plan 20261028_04, decision 3.5), already in
# Cargo.lock under toml 0.8.
toml_edit = "0.22"
# Binary transfers over the link (src/server/blob/, plan 20261028_05): the
# encoding and state machines, and the images store's safe folder calls
# (openat with O_NOFOLLOW, mkdirat, fstat, linkat), already in Cargo.lock.
libflankr_blob = { path = "crates/libflankr_blob" }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# Paused time for the confirmation broker's timers.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# tests/link.rs reads the pairing QR code back (plan 20261022_06, step 3).
png = "0.18"
rqrr = { version = "0.11", default-features = false }
# tests/terminal_attach.rs: the attachment against an in-process fake herdr
# (plan 20261027_08, steps 7 and 8).
libherdr_term = { path = "crates/libherdr_term", features = ["fake-server"] }

[workspace]
members = [
    ".",
    "crates/flankr-audio",
    "crates/flankr-companion",
    "crates/flankr-markdown",
    "crates/flankr-speech",
    "crates/libflankr_blob",
    "crates/libflankr_proto",
    "crates/libflankr_term",
    "crates/libherdr",
    "crates/libherdr_term",
    "crates/qrcodeurl"
]
# herdr's own source, read by libherdr_term's build.rs; never built here
# (docs/design/20261027_08_HERDR_TERMINAL_CRATE_PLAN.md, decision 14).
exclude = ["vendor/herdr"]
# flankr-audio is built with -p only: it compiles libvoicexn's ML stack
# (docs/design/20261022_04_COMPANION_APP_PLAN.md, 18:10 EDT amendment).
default-members = [
    ".",
    "crates/flankr-companion",
    "crates/flankr-markdown",
    "crates/flankr-speech",
    "crates/libflankr_blob",
    "crates/libflankr_proto",
    "crates/libflankr_term",
    "crates/libherdr",
    "crates/libherdr_term",
    "crates/qrcodeurl"
]
