[package]
name = "handlr"
version = "0.1.0"
edition = "2021"

[dependencies]
libherdr = { path = "crates/libherdr" }
smol = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
async-compat = "0.2"
schemars = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
libinfer = { path = "crates/libinfer" }
toml = "0.8"

[workspace]
members = [
    ".",
    "crates/libherdr",
    "crates/libinfer"
]
