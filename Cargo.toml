[package]
name = "handlr"
version = "0.1.0"
edition = "2021"

[dependencies]
libconversate = { path = "../libconversate/crates/libconversate", features = ["whisper", "tokio"] }
libgenai = { path = "../libgenai", features = ["tokio"] }
libherdr = { path = "crates/libherdr" }
audio_core = { path = "../libconversate/crates/audio_core" }
smol = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
async-compat = "0.2"
schemars = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
libinfer = { path = "crates/libinfer" }

[workspace]
members = [
    ".",
    "crates/libherdr",
    "crates/libinfer"
]
