[package]
name = "flankr-companion"
version = "0.1.0"
edition = "2024"
description = "The companion client: connection, sessions, keys and turn logic, without audio"

[dependencies]
libflankr_proto = { path = "../libflankr_proto", features = ["link"] }
# Replies read aloud when the daemon does not say how (plan 20261023_05, A5).
flankr-speech = { path = "../flankr-speech" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
log = "0.4"
# FileKeyStore: the key file is base64, the server record is TOML.
base64 = "0.22"
toml = "0.8"
# Input::Pair reads a data:image/png;base64, URL's QR code (plan
# 20261022_06, step 5).
png = "0.18"
rqrr = { version = "0.11", default-features = false }
# The default device name is the hostname.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Tests build the QR code's data URL as flankr pair does.
qrcodeurl = { path = "../qrcodeurl" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
