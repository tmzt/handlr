[package]
name = "flankr-audio"
version = "0.2.0"
edition = "2021"
description = "Audio for the companion front ends: libvoicexn speech in and out, joined to flankr-companion"

# Built with `-p flankr-audio` only: the root manifest leaves it out of
# `default-members`, so the root build never compiles xn, ptts or cpal
# (docs/design/20261022_04_COMPANION_APP_PLAN.md, 18:10 EDT amendment).

[dependencies]
flankr-companion = { path = "../flankr-companion" }
# libvoicexn v0.2.0: Phonon TTS, Kyutai STT, the earshot gate and the boost.
libvoicexn = { git = "https://github.com/tmzt/libvoicexn", rev = "32b8032082997a34190b458f79716d998a0d850a", features = ["stt-moshi-xn", "vad-earshot", "stt-moshi-xn-boost"] }
log = "0.4"
# `cpal`: the default input and output devices; the version voicexn-tty and
# libmobile use.
cpal = { version = "0.18.2", optional = true }
# `morph`: libmorph's Sink and Source types, at the companion app's
# revision (libmorph 0.5.1, tag v0.5.1). The adapters are in src/morph.rs, so
# libvoicexn's own `morph` feature, and its older libmorph, stay off.
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "c958897495d880c6117cae55e1b4d72b0c1b15a0", default-features = false, optional = true }

[features]
default = []
# Opens the default devices (companion-tty, and the libmorph desktop window).
cpal = ["dep:cpal"]
# libmorph's Source and Sink, through this crate's adapters (Android).
morph = ["dep:libmorph"]

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"

[[example]]
name = "echo"
required-features = ["cpal"]
