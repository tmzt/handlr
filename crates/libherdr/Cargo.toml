[package]
name = "libherdr"
version = "0.3.0"
edition = "2024"
description = "Transport layer and client for herdr terminal multiplexer"


[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
